<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">
    <aside id="leaderboard" class="leaderboard" aria-label="Classement des serpents">
      <h2>Classement</h2>
      <ol id="leaderboardList"></ol>
    </aside>

    <h1>Snake</h1>
    <p class="help">Deplace-toi avec les fleches ou ZQSD.</p>

    <div class="stats">
      <span>Score: <strong id="score">0</strong></span>
      <span>Meilleur: <strong id="bestScore">0</strong></span>
    </div>

    <canvas id="game" width="560" height="320" aria-label="Zone du jeu Snake"></canvas>

    <div class="actions">
      <button id="startBtn">Demarrer / Rejouer</button>
      <button id="fullscreenBtn">Plein ecran</button>
    </div>
    <p id="message">Appuie sur "Demarrer" pour jouer.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
